name: Backup

env:
  # Private by default, and it must stay that way: no public dev URL, no custom
  # domain. See the storage step for why this is not a GitHub artifact.
  BACKUP_BUCKET: inkloom-backups

# Runs OUTSIDE Cloudflare on purpose.
#
# A Worker cannot run pg_dump, and more importantly a backup living in the same
# failure domain as the thing it backs up is not much of a backup. GitHub holds
# the archives; Cloudflare and Neon hold the service. Losing either one leaves
# the other intact.
#
# TRIGGERS ARE TRUSTED-ONLY, DELIBERATELY.
# Only `schedule` and `workflow_dispatch` — never `pull_request`, and never
# `pull_request_target`. Both of those can run code proposed by a fork, and this
# workflow holds a database connection string and the key that decrypts every
# backup. There is no version of "a PR can start the backup job" that is safe.

on:
  schedule:
    # 02:10 UTC daily — an hour before the retention sweep at 03:20, so a backup
    # always exists from BEFORE the sweep deleted anything.
    - cron: "10 2 * * *"
    # 04:00 UTC Sundays: decrypt and restore a real STORED archive.
    - cron: "0 4 * * 0"
  workflow_dispatch:
    inputs:
      restore_test:
        description: Run the restore test instead of a backup
        type: boolean
        default: false

concurrency:
  group: backup
  cancel-in-progress: false

# Nothing here needs to write to the repository.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Take it, verify it, encrypt it, store it off-site.
  # ---------------------------------------------------------------------------
  backup:
    name: Back up ${{ matrix.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.schedule != '0 4 * * 0' && github.event.inputs.restore_test != 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, production]

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # pg_dump refuses to dump a server newer than itself and Neon runs 17, so
      # the runner's default client is not necessarily enough. Installing
      # explicitly turns a confusing version error into a step that either works
      # or fails loudly.
      # Installing the package is NOT enough, and this cost a failed run.
      #
      # Ubuntu ships `/usr/bin/pg_dump` as a postgresql-common wrapper that
      # selects a version, and installing client-17 alongside the preinstalled
      # 16 does not change which one it picks. The result was
      # "aborting because of server version mismatch: server 17.11, pg_dump
      # 16.15" — while the step's own `pg_dump --version` line sat in the log
      # saying 16.15 to nobody, because it was printed and never asserted.
      #
      # So: put the versioned directory FIRST on PATH, then FAIL if the version
      # is still wrong. A diagnostic that cannot fail the build is not a check.
      - name: Install and select pg_dump 17
        run: |
          set -euo pipefail
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          export PATH="/usr/lib/postgresql/17/bin:$PATH"

          version=$(pg_dump --version | grep -oE '[0-9]+' | head -1)
          echo "pg_dump resolves to: $(command -v pg_dump) ($(pg_dump --version))"
          if [ "$version" != "17" ]; then
            echo "::error title=Wrong pg_dump::Resolved to version $version, but Neon runs 17. \
            pg_dump refuses to dump a newer server, so the backup would fail."
            exit 1
          fi

      - name: Take, verify and encrypt
        id: dump
        env:
          DATABASE_URL: >-
            ${{ matrix.environment == 'production'
                && secrets.PRODUCTION_DATABASE_URL
                || secrets.STAGING_DATABASE_URL }}
          # The script refuses to write plaintext when CI is set, so a missing
          # key fails the run rather than quietly shipping readable data.
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::No DATABASE_URL for ${{ matrix.environment }} — skipping"
            echo "archived=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pnpm tsx scripts/backup.ts --out backups --label ${{ matrix.environment }}

          # The script also skips, without failing, when the database has no
          # schema yet — an environment whose migrations have not run has
          # nothing to archive. Report whether a file actually exists rather
          # than assuming the step's exit code implies one.
          if ls backups/*.sql.gz.enc >/dev/null 2>&1; then
            echo "archived=true" >> "$GITHUB_OUTPUT"
          else
            echo "archived=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nothing to archive for ${{ matrix.environment }}."
          fi

      # Retention lives here, declaratively. GitHub deletes the artifact when it
      # ---------------------------------------------------------------------
      # STORED IN R2, NOT IN A GITHUB ARTIFACT.
      #
      # This repository is PUBLIC, and GitHub's rule for artifacts is that
      # anyone signed in with READ access to the repository can download them —
      # which on a public repository is everybody. The artifact LISTING is worse
      # still: it answers anonymously, so a stranger could see that production
      # backups existed, how large they were and when they were taken, without
      # logging in at all.
      #
      # The archives were encrypted, so this was never a disclosure of anybody's
      # data. But it meant the only thing standing between 368 people's personal
      # details and the public internet was one secret, with no access control
      # behind it, on files that sat there for thirty days. Encryption is
      # supposed to be the second lock, not the only one.
      #
      # An R2 bucket is private by default and has no anonymous listing. Do NOT
      # attach a public dev URL or a custom domain to this bucket — that is the
      # one setting that would undo all of the above.
      #
      # Only `.enc` is uploaded. The glob is the last line of defence: if
      # encryption were ever skipped, this step finds no file and fails rather
      # than storing a readable copy of the database.
      #
      # `if` on the guard rather than on a missing-file option. Keeping the glob
      # strict is the point — but an environment that legitimately produced
      # nothing was still reaching it, so a backup job reported FAILED for a
      # database that had simply never been migrated. A red backup that means
      # "nothing to do" is worse than no alert, because the next real failure
      # looks exactly the same.
      #
      # ONE-TIME SETUP, if this is a fresh deployment:
      #   wrangler r2 bucket create inkloom-backups
      #   wrangler r2 bucket lifecycle add inkloom-backups expire "" \
      #     --expire-days 30
      # and give CLOUDFLARE_API_TOKEN the "Workers R2 Storage: Edit" permission.
      # ---------------------------------------------------------------------
      - name: Store it off-site, privately
        if: steps.dump.outputs.archived == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUCKET: ${{ env.BACKUP_BUCKET }}
          ENVIRONMENT: ${{ matrix.environment }}
        run: |
          set -euo pipefail

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error title=Cannot store the backup::CLOUDFLARE_API_TOKEN and \
            CLOUDFLARE_ACCOUNT_ID must be set, and the token needs the \
            'Workers R2 Storage: Edit' permission. A backup that was taken and not \
            stored is not a backup, so this fails rather than passing quietly."
            exit 1
          fi

          archive=$(ls backups/*.sql.gz.enc | head -1)
          name=$(basename "$archive")

          # The dated copy is the history; `latest` is a stable name the restore
          # test can fetch without needing to list the bucket, which wrangler
          # cannot do. Two writes of a file under a megabyte.
          for key in "$ENVIRONMENT/$name" "$ENVIRONMENT/latest.sql.gz.enc"; do
            echo "  -> r2://$BUCKET/$key"
            # `--filter`, because wrangler is a dependency of apps/web rather
            # than of the workspace root, and `pnpm exec` from the root does not
            # look into a workspace package's bin directory.
            pnpm --filter @inkloom/web exec wrangler r2 object put "$BUCKET/$key" \
              --file "../../$archive" --remote --content-type application/octet-stream
          done

          echo "  stored $name ($(du -h "$archive" | cut -f1)) in r2://$BUCKET/$ENVIRONMENT/"

      - name: Report failure
        if: failure()
        run: |
          echo "::error title=Backup failed::${{ matrix.environment }} backup did not complete. \
          A 'failed' row was recorded in job_runs, so the admin console shows it as degraded too."

  # ---------------------------------------------------------------------------
  # Weekly: decrypt and restore a REAL STORED archive into a real Postgres.
  # ---------------------------------------------------------------------------
  restore-test:
    name: Restore test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.schedule == '0 4 * * 0' || github.event.inputs.restore_test == 'true'
    permissions:
      # Read-only, and no `actions: read` any more. Archives no longer live in
      # GitHub artifacts, so this job has nothing to read from the Actions API
      # and should not be able to.
      contents: read

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: restore_test
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # Same wrapper problem as the backup job — see the note there.
      - name: Install and select psql 17
        run: |
          set -euo pipefail
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          export PATH="/usr/lib/postgresql/17/bin:$PATH"

          version=$(psql --version | grep -oE '[0-9]+' | head -1)
          echo "psql resolves to: $(command -v psql) ($(psql --version))"
          if [ "$version" != "17" ]; then
            echo "::error title=Wrong psql::Resolved to version $version, but the archives come from 17."
            exit 1
          fi

      # The newest STORED archive, from an earlier run. Not a fresh one: a
      # restore test that backs up and immediately restores proves only that the
      # code works, never that the thing in storage is still usable.
      #
      # PRODUCTION first, falling back to staging. It tested staging only, which
      # was right while production had no data and became wrong the moment it
      # did: the drill would have gone on passing against the one archive nobody
      # would ever need, and reported that as backup health.
      - name: Fetch the newest stored archive
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUCKET: ${{ env.BACKUP_BUCKET }}
        run: |
          set -euo pipefail
          mkdir -p backups

          # `latest` rather than a search through the bucket: wrangler has no
          # `r2 object list`, and the nightly job writes this name every time.
          # It is still an archive that has been SITTING IN STORAGE, written
          # hours earlier by a different run — which is the property that
          # matters. A restore test that takes a backup and immediately restores
          # it proves the code works and nothing about the thing you would
          # actually reach for.
          fetch() {
            # See the note in the backup job about `--filter`. Paths are
            # relative to apps/web once pnpm has changed directory into it.
            pnpm --filter @inkloom/web exec wrangler r2 object get \
              "$BUCKET/$1/latest.sql.gz.enc" \
              --file "../../backups/$1-latest.sql.gz.enc" --remote 2>/dev/null
          }

          if fetch production; then
            echo "Restoring the PRODUCTION archive."
          elif fetch staging; then
            echo "::notice::No production archive stored; falling back to staging."
          else
            echo "::error title=No stored backup::Nothing could be fetched from \
            r2://$BUCKET. Either the backup job has never completed successfully \
            (run this workflow once with 'Run the restore test' UNCHECKED first), or \
            CLOUDFLARE_API_TOKEN lacks the 'Workers R2 Storage: Edit' permission, or \
            this is a genuine backup outage. All three are worth interrupting someone \
            for, so none of them passes quietly."
            exit 1
          fi

          ls -la backups

      - name: Decrypt, restore and interrogate
        env:
          # The scratch Postgres, not staging. `restore-verify` only reads the
          # live database, and only to report what a restore would have lost.
          DATABASE_URL: postgresql://postgres:restore_test@localhost:5432/postgres
          SCRATCH_DB: restore_verify
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: pnpm tsx scripts/restore-verify.ts --dir backups

      # The verdict has to land in the REAL database, because that is where the
      # staleness signal and the admin console read from. `restore-verify` wrote
      # its own row against the scratch Postgres, which vanishes with the runner.
      # Recorded against BOTH environments, because the verdict is about the
      # backup system rather than about one database.
      #
      # It used to write to staging alone, which was fine while the drill only
      # ever restored a staging archive. Now that it restores production's, that
      # would leave production's console reporting `restore_test: never run`
      # forever — permanently degraded, for a drill that had just passed against
      # production's own archive. A health signal that cannot reach the
      # environment it describes is not a health signal.
      - name: Record the verdict
        if: always()
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          STATUS: ${{ job.status == 'success' && 'ok' || 'failed' }}
        run: |
          for name in STAGING_DATABASE_URL PRODUCTION_DATABASE_URL; do
            eval "url=\$$name"
            [ -z "$url" ] && continue
            DATABASE_URL="$url" pnpm tsx scripts/record-job.ts \
              --job restore_test \
              --status "$STATUS" \
              --note "weekly restore test of a stored archive, run ${{ github.run_id }}"
          done

      - name: Report failure
        if: failure()
        run: |
          echo "::error title=Restore test failed::A stored backup could not be decrypted or \
          restored, or the restored database failed its checks. Treat this as a backup outage: \
          the archives exist but have not been shown to work."
