packages:
  - "apps/*"
  - "packages/*"

# pnpm 11 build-script allowlist. Only these packages may run install scripts.
allowBuilds:
  esbuild: true
  workerd: true
  sharp: true
  "@tailwindcss/oxide": true

minimumReleaseAgeExclude:
  - "@cloudflare/vite-plugin@1.54.6"
  - miniflare@5.20260908.0-alpha
  - wrangler@4.130.0

# Transitive dependency pins.
#
# `sharp` arrives through miniflare (via wrangler and @cloudflare/vite-plugin)
# and carried a high-severity libheif advisory below 0.35.4. It is build and
# local-dev tooling and never reaches the deployed Worker, so the practical
# exposure is small — but waiting for Cloudflare to bump a transitive dep is
# not a plan, and CI is right to refuse to go green on a known high.
#
# In pnpm 11 overrides live HERE, not in package.json: the old `pnpm.overrides`
# field is silently ignored, which looks exactly like an override that did not
# work.
#
# `rolldown` is pinned because the registry is serving a broken dependency for
# 1.2.9: it requires `@oxc-project/types@=0.150.0`, which is not published (the
# latest is 0.149.0), so ANY re-resolution of vite's subtree fails the install
# outright. 1.2.7 is what the lockfile already resolved and builds fine. This
# pin is temporary — drop it once 1.2.9+ resolves, and note that the exact
# version matters here, since a range would drift straight back into 1.2.9.
#
# `pg` is pinned for the same reason: 8.23.1 requires `pg-protocol@^1.16.1`,
# and only 1.16.0 is published. 8.23.0 is the version already in the lockfile.
#
# The block below is the same story as `sharp`: advisories in transitive build
# and dev tooling that never reaches the deployed Worker, where the upstream
# package has not yet bumped its own dependency. Each is the minimum patched
# version named by the advisory, so they lift as soon as upstream catches up.
overrides:
  sharp: ">=0.35.5"
  rolldown: "1.2.7"
  pg: "8.23.0"
  undici: ">=7.29.1"
  source-map-js: ">=1.2.2"
  proxy-addr: ">=2.0.8"
  body-parser: ">=2.4.0"
  compression: ">=1.8.2"
  morgan: ">=1.12.1"
  qs: ">=6.16.1"
  esbuild: ">=0.24.3"
  # NO brace-expansion override. Its three DoS advisories cover >=4.0.0, fixed
  # in 5.0.12, and forcing that version globally breaks the build: v1 exported
  # the expander directly and v5 moved it to a named export, so minimatch@3
  # (reached through eslint 9) dies with "expand is not a function". The fix is
  # eslint 10, whose minimatch@10 depends on brace-expansion ^5.0.12 already.
  # Six advisories, all dev-server only (launch-editor argument handling and
  # server.fs escapes) and all fixed in 8.2.4. Held below 8.3 because vite 8.2.4
  # wants rolldown ~1.2.4, which the pin above satisfies; 8.3 moves that target.
  vite: ">=8.2.4 <8.3.0"
